# Локальная модель Ollama.
model = "qwen3.5:9b"

# Адрес локального API Ollama.
url = "http://127.0.0.1:11434/api/chat"

# Qwen 9B на ноутбуке может отвечать десятки секунд; после таймаута агент
# использует безопасный детерминированный парсер и не теряет входное ТЗ.
timeout_seconds = 60

# Ограничение контекста для ноутбука и модели 9B.
num_ctx = 4096

# Максимальный размер ответа модели.
num_predict = 900

# Нулевая температура нужна для воспроизводимого извлечения данных.
temperature = 0.0

# Число входных позиций в одном запросе к Qwen.
batch_size = 6

# Внутренние рассуждения модели отключены для экономии контекста.
think = false
