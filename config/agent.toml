# Курс доллара для ценовых матриц локального прайса.
usd_rub_rate = 81.0

# Сколько дней действует сформированное КП.
quote_valid_days = 5

# Гарантия, которая выводится в каждом коммерческом предложении.
warranty_text = "Гарантия на изделия 1 год."

# Максимальный срок изготовления после оплаты. Меняется без правки кода.
production_days = 10

# Как часто агент проверяет папку input, в секундах.
poll_seconds = 3

# Когда для позиции нет правила цены, агент задаёт вопрос в запущенном Терминале.
# Работает только при запуске через ./run_agent.command; при фоновом запуске пропускается.
interactive_clarifications = true

# Скидка, монтаж и доставка намеренно отсутствуют: вернём их отдельными модулями позже.
