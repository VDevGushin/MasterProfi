# Имя модели, установленной в локальной Ollama.
model = "qwen3.5:9b"

# Адрес локального сервера Ollama.
url = "http://127.0.0.1:11434/api/chat"

# Максимальное время ожидания одного ответа модели, в секундах.
timeout_seconds = 60

# Небольшой контекст и короткие ответы экономят ресурсы ноутбука.
num_ctx = 4096
num_predict = 900
batch_size = 6
temperature = 0.0
think = false
